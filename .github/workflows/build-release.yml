name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      
    - name: Build
      run: cmake --build build --config Release
      
    - name: Verify Output
      run: |
        if (!(Test-Path "build\bin\Release\AzkarReminder.exe")) { throw "Executable not found" }
        if (!(Test-Path "build\bin\Release\audio\diode_matrix.mp3")) { throw "Audio asset not found" }

    - name: Compile Inno Setup Installer
      uses: minicomp/iscc-action@v1
      with:
        iscc: installer/AzkarReminder.iss

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v3
      with:
        name: AzkarReminder-Setup-v1.1.0
        path: release/AzkarReminder-Setup-v1.1.0.exe

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: release/AzkarReminder-Setup-v1.1.0.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
