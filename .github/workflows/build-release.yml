name: Build and Multi-Platform Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. WINDOWS BUILD
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Core Tests & Windows App
      run: cmake --build build --config Release

    - name: Run Core Unit Tests
      run: .\build\Release\azkar_core_tests.exe

    - name: Verify Windows Binaries
      run: |
        if (!(Test-Path "build\bin\Release\AzkarReminder.exe")) { throw "Executable not found" }
        if (!(Test-Path "build\bin\Release\audio\diode_matrix.mp3")) { throw "Audio asset not found" }

    - name: Install Inno Setup
      run: choco install innosetup -y --no-progress

    - name: Compile Inno Setup Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\AzkarReminder.iss

    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: AzkarReminder-Windows-Setup
        path: release/*.exe

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. LINUX BUILD (Qt 6 + AppImage)
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (x86_64 AppImage)
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          qt6-base-dev \
          qt6-base-dev-tools \
          libgl1-mesa-dev \
          libasound2-dev \
          libpulse-dev \
          libx11-dev

    - name: Configure CMake
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_QT_APP=ON

    - name: Build
      run: cmake --build build --config Release

    - name: Run Core Unit Tests
      run: ./build/azkar_core_tests

    - name: Package AppImage Structure
      run: |
        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
        mkdir -p AppDir/usr/share/azkar-reminder/audio
        mkdir -p AppDir/usr/share/azkar-reminder/fonts
        
        cp build/azkar_reminder AppDir/usr/bin/
        if [ -f assets/content.md ]; then
          cp assets/content.md AppDir/usr/share/azkar-reminder/
        fi
        if [ -f assets/audio/diode_matrix.mp3 ]; then
          cp assets/audio/diode_matrix.mp3 AppDir/usr/share/azkar-reminder/audio/
        fi
        if [ -f assets/fonts/Cairo-Regular.ttf ]; then
          cp assets/fonts/Cairo-Regular.ttf AppDir/usr/share/azkar-reminder/fonts/
        fi
        
        if [ -f assets/images/logo.png ]; then
          cp assets/images/logo.png AppDir/azkar-reminder.png
          cp assets/images/logo.png AppDir/.DirIcon
          cp assets/images/logo.png AppDir/usr/share/icons/hicolor/256x256/apps/azkar-reminder.png
        fi

        # Create Desktop Entry
        cat <<EOF > AppDir/azkar-reminder.desktop
        [Desktop Entry]
        Type=Application
        Name=Azkar Reminder
        Exec=azkar_reminder
        Icon=azkar-reminder
        Categories=Utility;Clock;Qt;
        Terminal=false
        EOF
        
        # Create AppRun launcher
        cat <<'EOF' > AppDir/AppRun
        #!/bin/sh
        HERE="$(dirname "$(readlink -f "${0}")")"
        export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
        export PATH="${HERE}/usr/bin:${PATH}"
        exec "${HERE}/usr/bin/azkar_reminder" "$@"
        EOF
        chmod +x AppDir/AppRun

        # Download appimagetool
        wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
        chmod +x appimagetool
        ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir AzkarReminder-x86_64.AppImage

    - name: Upload Linux AppImage
      uses: actions/upload-artifact@v4
      with:
        name: AzkarReminder-Linux-AppImage
        path: AzkarReminder-x86_64.AppImage

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. macOS BUILD (Qt 6 + DMG)
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (Universal / x86_64 & arm64)
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Qt 6 via Homebrew
      run: |
        brew install qt@6 ninja create-dmg
        brew link --force qt@6

    - name: Configure CMake
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
          -DBUILD_QT_APP=ON

    - name: Build
      run: cmake --build build --config Release

    - name: Run Core Unit Tests
      run: ./build/azkar_core_tests

    - name: Package macOS App Bundle into DMG
      run: |
        APP_PATH="build/Azkar Reminder.app"
        if [ ! -d "${APP_PATH}" ]; then
          APP_PATH="build/azkar_reminder.app"
        fi
        
        # 1. Create native macOS .icns icon from logo.png
        if [ -f "assets/images/logo.png" ]; then
          mkdir -p azkar.iconset
          sips -z 16 16     assets/images/logo.png --out azkar.iconset/icon_16x16.png
          sips -z 32 32     assets/images/logo.png --out azkar.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/images/logo.png --out azkar.iconset/icon_32x32.png
          sips -z 64 64     assets/images/logo.png --out azkar.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/images/logo.png --out azkar.iconset/icon_128x128.png
          sips -z 256 256   assets/images/logo.png --out azkar.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/images/logo.png --out azkar.iconset/icon_256x256.png
          sips -z 512 512   assets/images/logo.png --out azkar.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/images/logo.png --out azkar.iconset/icon_512x512.png
          sips -z 1024 1024 assets/images/logo.png --out azkar.iconset/icon_512x512@2x.png
          mkdir -p "${APP_PATH}/Contents/Resources"
          iconutil -c icns azkar.iconset -o "${APP_PATH}/Contents/Resources/AzkarReminder.icns"
          rm -rf azkar.iconset
        fi

        # 2. Bundle resources
        mkdir -p "${APP_PATH}/Contents/Resources/audio"
        mkdir -p "${APP_PATH}/Contents/Resources/fonts"
        if [ -f assets/content.md ]; then
          cp assets/content.md "${APP_PATH}/Contents/Resources/"
        fi
        if [ -f assets/audio/diode_matrix.mp3 ]; then
          cp assets/audio/diode_matrix.mp3 "${APP_PATH}/Contents/Resources/audio/"
        fi
        if [ -f assets/fonts/Cairo-Regular.ttf ]; then
          cp assets/fonts/Cairo-Regular.ttf "${APP_PATH}/Contents/Resources/fonts/"
        fi

        # 3. Deploy Qt dependencies into bundle
        macdeployqt "${APP_PATH}" -verbose=1 || true

        # 4. Ad-hoc Code Sign inside-out (REQUIRED to prevent macOS 'damaged and can't be opened' error)
        find "${APP_PATH}/Contents/Frameworks" -type f -name "*.dylib" -exec codesign --force --verify --verbose --sign - {} \; 2>/dev/null || true
        find "${APP_PATH}/Contents/Frameworks" -type d -name "*.framework" -exec codesign --force --verify --verbose --sign - {} \; 2>/dev/null || true
        find "${APP_PATH}/Contents/PlugIns" -type f -name "*.dylib" -exec codesign --force --verify --verbose --sign - {} \; 2>/dev/null || true
        codesign --force --deep --verify --verbose --sign - "${APP_PATH}"

        # 5. Build clean DMG with /Applications symlink
        mkdir -p dmg_staging
        cp -R "${APP_PATH}" "dmg_staging/Azkar Reminder.app"
        ln -s /Applications dmg_staging/Applications
        
        # Create standard UDZO DMG
        hdiutil create -volname "Azkar Reminder" -srcfolder dmg_staging -ov -format UDZO "AzkarReminder-macOS.dmg"
        rm -rf dmg_staging

    - name: Upload macOS DMG
      uses: actions/upload-artifact@v4
      with:
        name: AzkarReminder-macOS-DMG
        path: "AzkarReminder-macOS.dmg"

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. GITHUB RELEASE
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4

    - name: Create Private Draft GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        draft: true
        prerelease: true
        name: "Azkar Reminder v1.2.0 (Private Preview)"
        files: |
          AzkarReminder-Windows-Setup/*
          AzkarReminder-Linux-AppImage/*
          AzkarReminder-macOS-DMG/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
