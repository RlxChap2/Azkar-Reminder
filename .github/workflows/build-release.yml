name: Build and Multi-Platform Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. WINDOWS BUILD
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Core Tests & Windows App
      run: cmake --build build --config Release

    - name: Run Core Unit Tests
      run: .\build\Release\azkar_core_tests.exe

    - name: Verify Windows Binaries
      run: |
        if (!(Test-Path "build\bin\Release\AzkarReminder.exe")) { throw "Executable not found" }
        if (!(Test-Path "build\bin\Release\audio\diode_matrix.mp3")) { throw "Audio asset not found" }

    - name: Install Inno Setup
      run: choco install innosetup -y --no-progress

    - name: Compile Inno Setup Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\AzkarReminder.iss

    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: AzkarReminder-Windows-Setup
        path: release/*.exe

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. LINUX BUILD (Qt 6 + AppImage with complete bundled Qt libraries)
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (x86_64 AppImage)
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          qt6-base-dev \
          qt6-base-dev-tools \
          qt6-qpa-plugins \
          qt6-wayland \
          libgl1-mesa-dev \
          libasound2-dev \
          libpulse-dev \
          libx11-dev \
          libxcb-cursor0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-sync1 \
          libxcb-xfixes0 \
          libxcb-xinerama0 \
          libxcb-xkb1 \
          libxkbcommon0 \
          libxkbcommon-x11-0 \
          libicu70 \
          file \
          patchelf

    - name: Configure CMake
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_QT_APP=ON

    - name: Build
      run: cmake --build build --config Release

    - name: Run Core Unit Tests
      run: ./build/azkar_core_tests

    - name: Package AppImage with bundled Qt
      run: |
        # ── 1. Prepare AppDir structure ───────────────────────────────────────
        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/lib
        mkdir -p AppDir/usr/plugins/platforms
        mkdir -p AppDir/usr/plugins/imageformats
        mkdir -p AppDir/usr/plugins/platforminputcontexts
        mkdir -p AppDir/usr/share/applications
        mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
        mkdir -p AppDir/usr/share/azkar-reminder/audio
        mkdir -p AppDir/usr/share/azkar-reminder/fonts

        cp build/azkar_reminder AppDir/usr/bin/

        [ -f assets/content.md ]              && cp assets/content.md              AppDir/usr/share/azkar-reminder/
        [ -f assets/audio/diode_matrix.mp3 ]  && cp assets/audio/diode_matrix.mp3  AppDir/usr/share/azkar-reminder/audio/
        [ -f assets/fonts/Cairo-Regular.ttf ] && cp assets/fonts/Cairo-Regular.ttf AppDir/usr/share/azkar-reminder/fonts/

        if [ -f assets/images/logo.png ]; then
          cp assets/images/logo.png AppDir/azkar-reminder.png
          cp assets/images/logo.png AppDir/.DirIcon
          cp assets/images/logo.png AppDir/usr/share/icons/hicolor/256x256/apps/azkar-reminder.png
        fi

        # ── 2. Desktop entry ──────────────────────────────────────────────────
        printf '[Desktop Entry]\nType=Application\nName=Azkar Reminder\nExec=azkar_reminder\nIcon=azkar-reminder\nCategories=Utility;Clock;Qt;\nTerminal=false\n' > AppDir/usr/share/applications/azkar-reminder.desktop
        cp AppDir/usr/share/applications/azkar-reminder.desktop AppDir/azkar-reminder.desktop

        # ── 3. Copy Qt6 shared libraries and all core dependencies ────────────
        QT_LIB_DIR="/usr/lib/x86_64-linux-gnu"
        echo "Copying Qt6 core libraries from $QT_LIB_DIR..."
        for lib in libQt6Core libQt6Gui libQt6Widgets libQt6DBus libQt6XcbQpa libQt6Network libQt6OpenGL libQt6WaylandClient; do
          find "$QT_LIB_DIR" -maxdepth 1 -name "${lib}.so*" -exec cp -Pv {} AppDir/usr/lib/ \; 2>/dev/null || true
        done

        echo "Copying ICU and supporting libraries..."
        for lib in libicuuc libicui18n libicudata libxkbcommon libxkbcommon-x11 libxcb-cursor libxcb-icccm libxcb-image libxcb-keysyms libxcb-randr libxcb-render-util libxcb-shape libxcb-sync libxcb-xfixes libxcb-xinerama libxcb-xkb; do
          find "$QT_LIB_DIR" -maxdepth 1 -name "${lib}.so*" -exec cp -Pv {} AppDir/usr/lib/ \; 2>/dev/null || true
        done

        echo "Copying Qt plugins..."
        QT_PLUGINS_DIR="/usr/lib/x86_64-linux-gnu/qt6/plugins"
        cp -rv "$QT_PLUGINS_DIR/platforms"/*.so AppDir/usr/plugins/platforms/ 2>/dev/null || true
        cp -rv "$QT_PLUGINS_DIR/imageformats"/*.so AppDir/usr/plugins/imageformats/ 2>/dev/null || true
        cp -rv "$QT_PLUGINS_DIR/platforminputcontexts"/*.so AppDir/usr/plugins/platforminputcontexts/ 2>/dev/null || true
        if [ -d "$QT_PLUGINS_DIR/xcbglintegrations" ]; then
          mkdir -p AppDir/usr/plugins/xcbglintegrations
          cp -rv "$QT_PLUGINS_DIR/xcbglintegrations"/*.so AppDir/usr/plugins/xcbglintegrations/ 2>/dev/null || true
        fi

        # Verify libqxcb.so exists (critical for X11 Linux!)
        if [ ! -f "AppDir/usr/plugins/platforms/libqxcb.so" ]; then
          echo "ERROR: libqxcb.so not found in AppDir/usr/plugins/platforms!"
          find /usr/lib -name "libqxcb.so" 2>/dev/null
          exit 1
        fi
        echo "libqxcb.so verified successfully!"

        # ── 4. Create qt.conf ─────────────────────────────────────────────────
        printf '[Paths]\nPrefix = ..\nPlugins = plugins\nLibraries = lib\n' > AppDir/usr/bin/qt.conf

        # ── 5. AppRun launcher ────────────────────────────────────────────────
        printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "${0}")")"\nexport LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"\nexport QT_PLUGIN_PATH="${HERE}/usr/plugins"\nexport QT_QPA_PLATFORM_PLUGIN_PATH="${HERE}/usr/plugins/platforms"\nexport XDG_DATA_DIRS="${HERE}/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"\nexport PATH="${HERE}/usr/bin:${PATH}"\nexec "${HERE}/usr/bin/azkar_reminder" "$@"\n' > AppDir/AppRun
        chmod +x AppDir/AppRun

        # ── 6. Pack into AppImage ─────────────────────────────────────────────
        echo "Downloading appimagetool..."
        wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
          -O appimagetool
        chmod +x appimagetool
        ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir AzkarReminder-x86_64.AppImage

        echo "=== AppImage built successfully ==="
        ls -lh AzkarReminder-x86_64.AppImage

    - name: Upload Linux AppImage
      uses: actions/upload-artifact@v4
      with:
        name: AzkarReminder-Linux-AppImage
        path: AzkarReminder-x86_64.AppImage

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. macOS BUILD (Qt 6 + DMG)
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (Universal / x86_64 & arm64)
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Qt 6 via Homebrew
      run: |
        brew install qt@6 ninja
        brew link --force qt@6

    - name: Configure CMake
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
          -DBUILD_QT_APP=ON

    - name: Build
      run: cmake --build build --config Release

    - name: Run Core Unit Tests
      run: ./build/azkar_core_tests

    - name: Debug — find built app bundles
      run: |
        echo "=== Contents of build/ ==="
        ls -la build/
        echo ""
        echo "=== All .app bundles found ==="
        find build -name "*.app" -maxdepth 4 -type d
        echo ""
        echo "=== All executables in build/ ==="
        find build -maxdepth 3 -type f -perm +111 | head -20

    - name: Package macOS App Bundle into DMG
      run: |
        set -e  # Fail on any error

        # ── 1. Locate the .app bundle (try multiple name variants) ────────────
        APP_PATH=""
        for candidate in \
          "build/Azkar Reminder.app" \
          "build/azkar_reminder.app" \
          "build/AzkarReminder.app" \
          "build/azkar-reminder.app"; do
          if [ -d "${candidate}" ]; then
            APP_PATH="${candidate}"
            echo "Found app bundle at: ${APP_PATH}"
            break
          fi
        done

        if [ -z "${APP_PATH}" ]; then
          echo "ERROR: No .app bundle found in build/! Listing build/ contents:"
          find build -maxdepth 3
          exit 1
        fi

        # ── 2. Create native macOS .icns icon from logo.png ──────────────────
        if [ -f "assets/images/logo.png" ]; then
          mkdir -p azkar.iconset
          sips -z 16   16   assets/images/logo.png --out azkar.iconset/icon_16x16.png
          sips -z 32   32   assets/images/logo.png --out azkar.iconset/icon_16x16@2x.png
          sips -z 32   32   assets/images/logo.png --out azkar.iconset/icon_32x32.png
          sips -z 64   64   assets/images/logo.png --out azkar.iconset/icon_32x32@2x.png
          sips -z 128  128  assets/images/logo.png --out azkar.iconset/icon_128x128.png
          sips -z 256  256  assets/images/logo.png --out azkar.iconset/icon_128x128@2x.png
          sips -z 256  256  assets/images/logo.png --out azkar.iconset/icon_256x256.png
          sips -z 512  512  assets/images/logo.png --out azkar.iconset/icon_256x256@2x.png
          sips -z 512  512  assets/images/logo.png --out azkar.iconset/icon_512x512.png
          sips -z 1024 1024 assets/images/logo.png --out azkar.iconset/icon_512x512@2x.png
          mkdir -p "${APP_PATH}/Contents/Resources"
          iconutil -c icns azkar.iconset -o "${APP_PATH}/Contents/Resources/AzkarReminder.icns"
          rm -rf azkar.iconset
          echo "Icon generated successfully"
        fi

        # ── 3. Bundle app resources ───────────────────────────────────────────
        mkdir -p "${APP_PATH}/Contents/Resources/audio"
        mkdir -p "${APP_PATH}/Contents/Resources/fonts"
        [ -f assets/content.md ]              && cp assets/content.md              "${APP_PATH}/Contents/Resources/"
        [ -f assets/audio/diode_matrix.mp3 ]  && cp assets/audio/diode_matrix.mp3  "${APP_PATH}/Contents/Resources/audio/"
        [ -f assets/fonts/Cairo-Regular.ttf ] && cp assets/fonts/Cairo-Regular.ttf "${APP_PATH}/Contents/Resources/fonts/"

        # ── 4. Deploy Qt dependencies into bundle ─────────────────────────────
        echo "Running macdeployqt on: ${APP_PATH}"
        macdeployqt "${APP_PATH}" -verbose=1

        # Copy any transitive Homebrew dylibs that macdeployqt may have missed
        for dylib in libbrotlicommon libbrotlidec libsharpyuv libwebp libwebpdemux libwebpmux; do
          find /opt/homebrew/lib -name "${dylib}*.dylib" -exec cp -f {} "${APP_PATH}/Contents/Frameworks/" \; 2>/dev/null || true
        done

        # Fix rpath for all dylibs in Frameworks
        find "${APP_PATH}/Contents/Frameworks" -type f \( -name "*.dylib" -o -name "*.so" \) | while read -r lib; do
          install_name_tool -id "@rpath/$(basename "$lib")" "$lib" 2>/dev/null || true
        done
        install_name_tool -add_rpath "@executable_path/../Frameworks" "${APP_PATH}/Contents/MacOS/Azkar Reminder" 2>/dev/null || true

        # Clean extended attributes
        xattr -cr "${APP_PATH}" 2>/dev/null || true

        # ── 5. Ad-hoc Code Sign inside-out (no --options runtime to avoid Notarization demand) ─
        echo "Ad-hoc signing all dylibs and frameworks..."
        find "${APP_PATH}/Contents/Frameworks" -type f \( -name "*.dylib" -o -name "*.so" \) \
          -exec codesign --force --sign - {} \; 2>/dev/null || true
        find "${APP_PATH}/Contents/Frameworks" -type d -name "*.framework" \
          -exec codesign --force --sign - {} \; 2>/dev/null || true
        find "${APP_PATH}/Contents/PlugIns" -type f \( -name "*.dylib" -o -name "*.so" \) \
          -exec codesign --force --sign - {} \; 2>/dev/null || true
        
        codesign --force --sign - "${APP_PATH}/Contents/MacOS/Azkar Reminder"
        codesign --force --deep --sign - "${APP_PATH}"
        codesign --verify --deep --strict --verbose=2 "${APP_PATH}" || true
        echo "Code signing complete"

        # ── 6. Build DMG with /Applications symlink & One-Click Fix Script ────
        mkdir -p dmg_staging
        cp -R "${APP_PATH}" "dmg_staging/Azkar Reminder.app"
        ln -s /Applications dmg_staging/Applications

        # Helper script inside DMG to remove quarantine with a single double-click
        printf '#!/bin/bash\nDIR="$(cd "$(dirname "$0")" && pwd)"\necho "Removing macOS quarantine for Azkar Reminder..."\nxattr -cr "/Applications/Azkar Reminder.app" 2>/dev/null || xattr -cr "$DIR/Azkar Reminder.app" 2>/dev/null\necho "Done! Opening Azkar Reminder..."\nopen "/Applications/Azkar Reminder.app" 2>/dev/null || open "$DIR/Azkar Reminder.app" 2>/dev/null\n' > "dmg_staging/Fix-Permissions.command"
        chmod +x "dmg_staging/Fix-Permissions.command"

        hdiutil create \
          -volname "Azkar Reminder" \
          -srcfolder dmg_staging \
          -ov -format UDZO \
          "AzkarReminder-macOS.dmg"
        rm -rf dmg_staging

        echo "=== DMG built successfully ==="
        ls -lh AzkarReminder-macOS.dmg

    - name: Upload macOS DMG
      uses: actions/upload-artifact@v4
      with:
        name: AzkarReminder-macOS-DMG
        path: "AzkarReminder-macOS.dmg"

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. GITHUB RELEASE
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        draft: false
        prerelease: false
        name: "Azkar Reminder ${{ github.ref_name }}"
        body: |
          ## Azkar Reminder ${{ github.ref_name }}

          > بسم الله الرحمن الرحيم — تطبيق مكتب سطح مكتب هادئ وعصري للتذكير بالأذكار اليومية

          ### 📥 روابط التثبيت المباشر

          | Platform | File | Size |
          |----------|------|------|
          | 🪟 **Windows** (10/11) | `AzkarReminder-Windows-Setup.exe` | ~16 MB |
          | 🐧 **Linux** (Ubuntu, Fedora, Arch, etc.) | `AzkarReminder-x86_64.AppImage` | ~60 MB |
          | 🍎 **macOS** (Apple Silicon & Intel, macOS 11+) | `AzkarReminder-macOS.dmg` | ~38 MB |

          ---

          ### 🍎 macOS — خطوات التثبيت وتشغيل التطبيق

          > ⚠️ **مهم**: macOS يضع ملفات التحميل في وضع الحجر الصحي (Gatekeeper Quarantine). لتشغيل التطبيق بسهولة:

          **الطريقة الأولى (الأسل والأسرع):**
          1. افتح ملف `AzkarReminder-macOS.dmg`.
          2. اسحب `Azkar Reminder.app` إلى مجلد `Applications`.
          3. اضغط مرتين على ملف **`Fix-Permissions.command`** الموجود داخل الـ DMG نفسه لإزالة الحظر وفتح التطبيق فوراً.

          **الطريقة الثانية (عبر الـ Terminal):**
          افتح الـ Terminal ونفذ الأمر التالي:
          ```bash
          xattr -cr "/Applications/Azkar Reminder.app"
          ```
          ثم افتح التطبيق من Launchpad أو مجلد التطبيقات.

          ---

          ### 🐧 Linux — خطوات التثبيت

          1. حمّل `AzkarReminder-x86_64.AppImage`.
          2. اجعل الملف قابلاً للتشغيل:
          ```bash
          chmod +x AzkarReminder-x86_64.AppImage
          ```
          3. شغّل التطبيق:
          ```bash
          ./AzkarReminder-x86_64.AppImage
          ```

          ---

          ### 🪟 Windows — خطوات التثبيت

          1. حمّل `AzkarReminder-Windows-Setup.exe`.
          2. شغّل المثبت واتبع الخطوات البسيطة.
          3. سيعمل التطبيق في شريط المهام (System Tray) تلقائياً.
        files: |
          AzkarReminder-Windows-Setup/*
          AzkarReminder-Linux-AppImage/*
          AzkarReminder-macOS-DMG/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
